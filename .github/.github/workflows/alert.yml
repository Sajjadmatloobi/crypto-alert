name: Crypto Growth Alert

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run alert check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python crypto_alert.py

      - name: Commit updated state file
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add crypto_alert_state.json
          git diff --quiet && git diff --staged --quiet || git commit -m "update state [skip ci]"
          git push
