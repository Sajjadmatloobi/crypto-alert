name: BTC Scalp Alert (MEXC)

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check-market:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r btc-alarm-addon/requirements.txt

      - name: Run alert check
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        working-directory: btc-alarm-addon
        run: python btc_scalp_check.py

      - name: Commit updated state
        run: |
          git config user.name "btc-alert-bot"
          git config user.email "actions@github.com"
          git add btc-alarm-addon/btc_scalp_state.json
          git diff --quiet && git diff --staged --quiet || git commit -m "update btc scalp state [skip ci]"
          git push
